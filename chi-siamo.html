<!DOCTYPE html>
<html lang="it" class="notranslate" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>Chi siamo · Visit Gubbio</title>
  <meta name="description" content="Matteo e Leonardo, due ragazzi nati e cresciuti a Gubbio: la storia di Visit Gubbio." />
  <link rel="canonical" href="https://visitgubbio.eu/chi-siamo.html" />
  <link rel="icon" type="image/png" href="img/logo-app.png" />
  <script>document.documentElement.className += " js";</script>
  <link rel="stylesheet" href="home.css" />
</head>
<body>
  <main class="page">

    <div class="topbar enter" style="--d: 0ms">
      <a class="back-link" href="home.html"><span aria-hidden="true">←</span> <span data-i18n="back"></span></a>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="it">IT</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="de">DE</button>
        <button type="button" data-lang="fr">FR</button>
      </div>
    </div>

    <header class="about-hero enter" style="--d: 80ms">
      <div class="duo" aria-hidden="true">
        <span class="duo-face duo-matteo">👨‍💻</span>
        <span class="duo-hello">👋</span>
        <span class="duo-face duo-leonardo">👨‍🔧</span>
      </div>
      <h1 data-i18n="heroTitle"></h1>
      <p class="subtitle" data-i18n="heroText"></p>
    </header>

    <section class="story reveal">
      <img src="img/palazzo.png" width="192" height="192" alt="" />
      <div>
        <h2 data-i18n="s1Title"></h2>
        <p data-i18n="s1Text1"></p>
        <p data-i18n="s1Text2"></p>
      </div>
    </section>

    <section class="story story-flip reveal">
      <img src="img/crescia.png" width="192" height="192" alt="" />
      <div>
        <h2 data-i18n="s2Title"></h2>
        <p data-i18n="s2Text1"></p>
        <p data-i18n="s2Text2"></p>
      </div>
    </section>

    <section class="people" aria-labelledby="people-title">
      <h2 id="people-title" class="reveal" data-i18n="peopleTitle"></h2>
      <div class="people-grid">
        <article class="person reveal" style="--d: 0ms">
          <span class="person-face duo-matteo" aria-hidden="true">👨‍💻</span>
          <h3>Matteo Sebastiani</h3>
          <p class="person-role" data-i18n="matteoRole"></p>
          <p data-i18n="matteoText"></p>
        </article>
        <article class="person reveal" style="--d: 120ms">
          <span class="person-face duo-leonardo" aria-hidden="true">👨‍🔧</span>
          <h3>Leonardo Cambiotti</h3>
          <p class="person-role" data-i18n="leonardoRole"></p>
          <p data-i18n="leonardoText"></p>
        </article>
      </div>
    </section>

    <section class="join-banner reveal">
      <h2 data-i18n="closeTitle"></h2>
      <p data-i18n="closeText"></p>
      <a class="btn" href="home.html#contatti" data-i18n="closeCta"></a>
    </section>

    <footer class="footer">
      <p class="tagline">Visit Gubbio · <span data-i18n="tagline"></span></p>
      <nav>
        <a href="privacy-policy.html" data-i18n="privacy"></a>
        <span aria-hidden="true">·</span>
        <a href="terms.html" data-i18n="terms"></a>
      </nav>
    </footer>
  </main>

  <script src="chi-siamo.js"></script>
</body>
</html>
