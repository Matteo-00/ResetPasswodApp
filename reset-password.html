<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visit Gubbio</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="reset-password.css" />

  <!-- Selettore lingua: stile minimo, in più rispetto a reset-password.css -->
  <style>
    .lang-switch {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 0 0 18px;
    }
    .lang-switch button {
      border: 1px solid #d8d3cb;
      background: #ffffff;
      color: #162b3d;
      font: 700 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      letter-spacing: 0.4px;
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
    }
    .lang-switch button[aria-pressed="true"] {
      background: #b13b2e;
      border-color: #b13b2e;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="card">

      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="it">IT</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="de">DE</button>
        <button type="button" data-lang="fr">FR</button>
      </div>

      <img class="logo" src="logo.png" alt="Visit Gubbio" />

      <!-- STATO: caricamento iniziale (verifica link di recovery) -->
      <section id="state-loading" class="state">
        <div class="spinner" aria-hidden="true"></div>
        <p class="muted" data-i18n="loading"></p>
      </section>

      <!-- STATO: form nuova password (mostrato solo con sessione di recovery valida) -->
      <section id="state-form" class="state hidden">
        <h1 data-i18n="formTitle"></h1>
        <p class="subtitle" data-i18n="formSubtitle"></p>

        <form id="reset-form" novalidate>
          <label class="field-label" for="password" data-i18n="passwordLabel"></label>
          <div class="input-wrap">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              data-i18n-placeholder="passwordPlaceholder"
              required
            />
            <button type="button" class="toggle-visibility" data-target="password" data-i18n="show" data-i18n-aria="toggleAria"></button>
          </div>
          <p class="error-text" id="error-password"></p>

          <label class="field-label" for="password-confirm" data-i18n="confirmLabel"></label>
          <div class="input-wrap">
            <input
              id="password-confirm"
              name="password-confirm"
              type="password"
              autocomplete="new-password"
              data-i18n-placeholder="confirmPlaceholder"
              required
            />
            <button type="button" class="toggle-visibility" data-target="password-confirm" data-i18n="show" data-i18n-aria="toggleAria"></button>
          </div>
          <p class="error-text" id="error-password-confirm"></p>

          <p class="error-text form-error" id="error-general"></p>

          <button type="submit" id="submit-btn" class="btn-primary" disabled>
            <span id="submit-label" data-i18n="submit"></span>
          </button>
        </form>
      </section>

      <!-- STATO: successo -->
      <section id="state-success" class="state hidden">
        <div class="icon-badge success">✓</div>
        <h1 data-i18n="successTitle"></h1>
        <p class="subtitle">
          <span data-i18n="successText1"></span><br />
          <span data-i18n="successText2"></span>
        </p>
      </section>

      <!-- STATO: link non valido / scaduto -->
      <section id="state-invalid" class="state hidden">
        <div class="icon-badge error">⚠️</div>
        <h1 data-i18n="invalidTitle"></h1>
        <p class="subtitle" data-i18n="invalidText"></p>
      </section>
    </div>

    <p class="footer-note">Visit Gubbio · <span data-i18n="tagline"></span></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Traduzioni: devono stare PRIMA di reset-password.js -->
  <script>
// Visit Gubbio - traduzioni della pagina "Reimposta password" (IT / EN / DE / FR).
//
// Scelta della lingua, in quest'ordine:
//   1) quella scelta con i pulsanti IT / EN / DE / FR (si ricorda);
//   2) il parametro ?lang=en nel link;
//   3) la lingua del browser / telefono;
//   4) italiano.
//
// Espone window.vgI18n:
//   vgI18n.t("chiave")      -> testo nella lingua corrente
//   vgI18n.lang()           -> "it" | "en" | "de" | "fr"
// così anche reset-password.js può mostrare messaggi tradotti.
(function () {
  var TEXTS = {
    it: {
      title: "Reimposta password · Visit Gubbio",
      loading: "Verifica del link in corso…",
      formTitle: "Reimposta la tua password",
      formSubtitle: "Inserisci la nuova password per il tuo account.",
      passwordLabel: "Nuova password",
      passwordPlaceholder: "Almeno 6 caratteri",
      confirmLabel: "Conferma nuova password",
      confirmPlaceholder: "Ripeti la password",
      show: "Mostra",
      hide: "Nascondi",
      toggleAria: "Mostra/nascondi password",
      submit: "Cambia password",
      saving: "Salvataggio…",
      successTitle: "Password modificata!",
      successText1: "La password è stata aggiornata correttamente.",
      successText2: "Ora puoi effettuare nuovamente l'accesso dall'app.",
      invalidTitle: "Link non valido o scaduto",
      invalidText: "Richiedi nuovamente il recupero della password dall'app.",
      errTooShort: "La password deve avere almeno 6 caratteri.",
      errMismatch: "Le due password non coincidono.",
      errGeneral: "Impossibile aggiornare la password. Riprova.",
      tagline: "Scopri. Vivi. Ricorda."
    },
    en: {
      title: "Reset password · Visit Gubbio",
      loading: "Checking your link…",
      formTitle: "Reset your password",
      formSubtitle: "Enter the new password for your account.",
      passwordLabel: "New password",
      passwordPlaceholder: "At least 6 characters",
      confirmLabel: "Confirm new password",
      confirmPlaceholder: "Repeat the password",
      show: "Show",
      hide: "Hide",
      toggleAria: "Show/hide password",
      submit: "Change password",
      saving: "Saving…",
      successTitle: "Password changed!",
      successText1: "Your password has been updated successfully.",
      successText2: "You can now log in again from the app.",
      invalidTitle: "Invalid or expired link",
      invalidText: "Please request a new password reset from the app.",
      errTooShort: "The password must be at least 6 characters long.",
      errMismatch: "The two passwords do not match.",
      errGeneral: "Unable to update the password. Please try again.",
      tagline: "Discover. Live. Remember."
    },
    de: {
      title: "Passwort zurücksetzen · Visit Gubbio",
      loading: "Link wird überprüft…",
      formTitle: "Passwort zurücksetzen",
      formSubtitle: "Gib das neue Passwort für dein Konto ein.",
      passwordLabel: "Neues Passwort",
      passwordPlaceholder: "Mindestens 6 Zeichen",
      confirmLabel: "Neues Passwort bestätigen",
      confirmPlaceholder: "Passwort wiederholen",
      show: "Anzeigen",
      hide: "Verbergen",
      toggleAria: "Passwort anzeigen/verbergen",
      submit: "Passwort ändern",
      saving: "Wird gespeichert…",
      successTitle: "Passwort geändert!",
      successText1: "Dein Passwort wurde erfolgreich aktualisiert.",
      successText2: "Du kannst dich jetzt wieder in der App anmelden.",
      invalidTitle: "Ungültiger oder abgelaufener Link",
      invalidText: "Fordere in der App erneut das Zurücksetzen des Passworts an.",
      errTooShort: "Das Passwort muss mindestens 6 Zeichen lang sein.",
      errMismatch: "Die beiden Passwörter stimmen nicht überein.",
      errGeneral: "Das Passwort konnte nicht aktualisiert werden. Versuche es erneut.",
      tagline: "Entdecken. Erleben. Erinnern."
    },
    fr: {
      title: "Réinitialiser le mot de passe · Visit Gubbio",
      loading: "Vérification du lien en cours…",
      formTitle: "Réinitialisez votre mot de passe",
      formSubtitle: "Saisissez le nouveau mot de passe de votre compte.",
      passwordLabel: "Nouveau mot de passe",
      passwordPlaceholder: "Au moins 6 caractères",
      confirmLabel: "Confirmez le nouveau mot de passe",
      confirmPlaceholder: "Répétez le mot de passe",
      show: "Afficher",
      hide: "Masquer",
      toggleAria: "Afficher/masquer le mot de passe",
      submit: "Changer le mot de passe",
      saving: "Enregistrement…",
      successTitle: "Mot de passe modifié !",
      successText1: "Votre mot de passe a bien été mis à jour.",
      successText2: "Vous pouvez maintenant vous reconnecter depuis l'application.",
      invalidTitle: "Lien invalide ou expiré",
      invalidText: "Demandez à nouveau la réinitialisation du mot de passe depuis l'application.",
      errTooShort: "Le mot de passe doit contenir au moins 6 caractères.",
      errMismatch: "Les deux mots de passe ne correspondent pas.",
      errGeneral: "Impossible de mettre à jour le mot de passe. Réessayez.",
      tagline: "Découvrir. Vivre. Se souvenir."
    }
  };

  var SUPPORTED = ["it", "en", "de", "fr"];
  var current = "it";

  function pickLanguage() {
    var saved = null;
    try { saved = localStorage.getItem("vg_lang"); } catch (e) {}
    if (saved && SUPPORTED.indexOf(saved) !== -1) return saved;

    var fromUrl = new URLSearchParams(window.location.search).get("lang");
    if (fromUrl && SUPPORTED.indexOf(fromUrl.slice(0, 2)) !== -1) {
      return fromUrl.slice(0, 2);
    }

    var list = navigator.languages && navigator.languages.length
      ? navigator.languages
      : [navigator.language || "it"];
    for (var i = 0; i < list.length; i++) {
      var code = String(list[i]).slice(0, 2).toLowerCase();
      if (SUPPORTED.indexOf(code) !== -1) return code;
    }
    return "it";
  }

  function t(key) {
    var dict = TEXTS[current] || TEXTS.it;
    return dict[key] !== undefined ? dict[key] : (TEXTS.it[key] || key);
  }

  function apply(lang) {
    current = lang;
    document.documentElement.lang = lang;
    document.title = t("title");

    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) {
      el.setAttribute("placeholder", t(el.getAttribute("data-i18n-placeholder")));
    });
    document.querySelectorAll("[data-i18n-aria]").forEach(function (el) {
      el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria")));
    });
    document.querySelectorAll(".lang-switch button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false");
    });
  }

  window.vgI18n = {
    t: t,
    lang: function () { return current; }
  };

  function init() {
    document.querySelectorAll(".lang-switch button").forEach(function (b) {
      b.addEventListener("click", function () {
        var lang = b.getAttribute("data-lang");
        try { localStorage.setItem("vg_lang", lang); } catch (e) {}
        apply(lang);
      });
    });
    apply(pickLanguage());
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
  </script>
  <script src="reset-password.js"></script>
</body>
</html>
